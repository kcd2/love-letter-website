<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Una romántica carta de amor para Dana">
  <meta name="author" content="Kei">
  <meta name="theme-color" content="#ffe">

  <!-- Open Graph -->
  <meta property="og:title" content="Nuestra Historia | Kei y Dana">
  <meta property="og:description" content="Una carta de amor y el tiempo que llevamos juntos">
  <meta property="og:type" content="website">

  <!-- Title & Resources -->
  <title>Para Dana | Nuestra Historia</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="config.js"></script>

  <!-- Nuevas fuentes de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Music -->
  <audio loop id="bgm" preload="auto" aria-label="Background music">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
  
  <!-- Main Container -->
  <div id="viewport">
    <div id="main">
      <!-- Love Letter Content -->
      <div id="letter" role="article"></div>
      
      <!-- Time Counter -->
      <div id="clock-box" role="timer">
        <div id="clock-text"></div>
        <div id="clock"></div>
      </div>
      
      <!-- Ground Canvas -->
      <canvas id="ground-canvas" aria-hidden="true"></canvas>

      <!-- Static Canvas (tree) -->
      <canvas id="static-canvas" aria-hidden="true"></canvas>

      <!-- Dynamic Canvas (falling hearts) -->
      <canvas id="canvas" aria-label="Animated tree with hearts"></canvas>
    </div>
  </div>
  
  <!-- Main Script -->
  <script src="js/geometry.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
